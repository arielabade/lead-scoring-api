[project]
name = "lead-scoring-api"
version = "1.0.0"
description = "Lead scoring on the UCI Bank Marketing campaign, served over FastAPI with leakage-aware evaluation"
requires-python = ">=3.10"
dependencies = [
    "lightgbm>=4.0",
    "scikit-learn>=1.6",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "joblib>=1.3",
    "mlflow>=2.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
